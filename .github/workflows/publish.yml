# Publish pykvd to TestPyPI on version tags (e.g. v1.1.0).
# Uses Trusted Publishing (OIDC), no API token needed.
# One-time setup: on https://test.pypi.org/manage/project/pykvd/settings/publishing/
# add a GitHub publisher with owner key-value-document, repo pykvd,
# workflow publish.yml (no environment).

name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag version: $TAG"
          echo "package version: $VER"
          if [ "$TAG" != "$VER" ]; then
            echo "Tag v$TAG does not match pyproject.toml version $VER" >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          maturin sdist --out dist
          maturin build --release --out dist
          ls -l dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true

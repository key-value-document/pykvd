[package]
name = "pykvd"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false
repository = "https://github.com/key-value-document/pykvd"

[lib]
name = "pykvd"
crate-type = ["cdylib"]

[dependencies]
kvd-rs = "1.0.0"
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py311"] }

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pykvd"
version = "1.1.1"
description = "Python bindings for the KVD key-value document format"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["kvd", "config", "serialization", "data-format"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "src"
